{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small class="error-text">{{ field.errors|striptags }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="switch-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
