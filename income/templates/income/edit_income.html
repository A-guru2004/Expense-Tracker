{% extends 'base.html' %}
{% block title %}Edit Income{% endblock %}
{% block content %}
<h2>Edit Income</h2>

<div class="add-form-box">
    <form method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label>Source</label>
                <select name="source" required>
                    {% for value, label in source_choices %}
                    <option value="{{ value }}" {% if value == income.source %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" name="amount" step="0.01" value="{{ income.amount }}" required>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="date" value="{{ income.date|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <input type="text" name="notes" value="{{ income.notes }}">
            </div>
        </div>
        <button type="submit" class="btn">Update Income</button>
        <a href="{% url 'income' %}" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
